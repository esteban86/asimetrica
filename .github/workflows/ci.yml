name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Fuerza Node 24 en las actions (las que aún declaran Node 20, deprecado).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --prefix apps/web

      - name: Type check (astro check)
        run: npm run check --prefix apps/web

      - name: Build
        run: npm run build --prefix apps/web
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
