name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Las actions de GitHub aún declaran Node 20 (deprecado el 16-jun-2026).
# Esto las fuerza a correr en Node 24 desde ya, sin esperar a versiones nuevas.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --prefix apps/web
        env:
          # Astro expone al cliente solo las variables con prefijo PUBLIC_.
          # Reutilizamos el secret existente VITE_WEB3FORMS_KEY.
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          # Token de Cloudflare Web Analytics (opcional; vacío = sin analítica).
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
          # Google Tag Manager (opcional; vacío = sin GTM/GA4).
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}
          # Microsoft Clarity (opcional; vacío = sin Clarity).
          PUBLIC_CLARITY_ID: ${{ secrets.PUBLIC_CLARITY_ID }}
          # Google Apps Script endpoint para la bitácora de leads (opcional).
          PUBLIC_SHEET_ENDPOINT: ${{ secrets.PUBLIC_SHEET_ENDPOINT }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/apps/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
